name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-vector-clock-and-orchestrator:
    name: Java Vector Clock & Orchestrator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run All Orchestrator Test Suites
        run: |
          cd orchestrator
          gradle test --info

  test-go-capture-agent:
    name: Go Capture Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go Race Detector Tests
        run: |
          cd capture-agent
          go test -race -v ./...

  test-python-services:
    name: Python ML & LLM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Anomaly Detector
        run: |
          cd anomaly-detector
          pip install -r requirements.txt pytest
          pytest tests/ -v
      - name: Test LLM Analyzer
        run: |
          cd llm-analyzer
          pip install -r requirements.txt pytest
          pytest tests/ -v

  test-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build
